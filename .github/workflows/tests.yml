# Runs every automated test on fresh machines for each push and pull request.
# Backend tests run on Linux AND Windows to show the code is not tied to one operating system.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only PyTorch, then the backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Unit and integration tests (real model)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend (unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end (Chromium, Firefox, WebKit, mobile)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
      - name: Install frontend and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Run end-to-end tests
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
