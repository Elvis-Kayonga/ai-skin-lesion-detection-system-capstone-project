# Render Blueprint for the free online demo. In Render: New > Blueprint > pick this repo.
# You will be asked for DATABASE_URL (the Supabase "Session pooler" connection string). SECRET_KEY is
# generated by Render. See deploy/render/README.md.
services:
  - type: web
    name: skin-lesion-screening
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
